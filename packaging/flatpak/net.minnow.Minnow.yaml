id: net.minnow.Minnow
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: minnow

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # A file manager fundamentally needs broad filesystem access; this matches how other
  # Flatpak'd file managers (Nautilus, Dolphin) are sandboxed.
  - --filesystem=host
  - --filesystem=xdg-run/dconf
  - --talk-name=org.freedesktop.FileManager1
  # Needed for KIO (thumbnailing, trash, mounted-drive listing via kiod).
  - --talk-name=org.kde.kiod6
  - --system-talk-name=org.freedesktop.UDisks2

modules:
  - name: minnow
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://github.com/minnowfm/minnow
        # PLACEHOLDER: no tags exist yet. Replace with a real release tag (or commit) once
        # this repository has been pushed to and tagged.
        tag: v0.1.0

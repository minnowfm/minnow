name: minnow
version: '0.1.1'
summary: A simple, lightweight file manager for KDE
description: |
  Minnow is a small, KIO-based file browser built as a lighter alternative to Dolphin:
  grid and list views, a customizable places sidebar, and standard file operations,
  without the extra panels and configuration surface of a full-featured file manager.
license: GPL-3.0-or-later
confinement: strict
grade: stable
base: core24
compression: lzo

# heads up: home + removable-media plugs only cover the user's home dir and removable
# media, not arbitrary host paths like Flatpak's --filesystem=host. browsing /etc or other
# users' homes won't work here without system-files/personal-files too.
apps:
  minnow:
    command: usr/bin/minnow
    extensions: [kde-neon-6]
    plugs:
      - home
      - removable-media
      - mount-observe
      - network

parts:
  minnow:
    plugin: cmake
    source: https://github.com/minnowfm/minnow.git
    source-tag: 'v0.1.1' # TODO: no tags pushed yet, update once we actually cut one
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    # kde-neon-6 extension above already pulls in Qt6/KF6 via the KDE content snaps, so
    # no libkf6*-dev packages needed here
    build-packages:
      - extra-cmake-modules

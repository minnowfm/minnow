name: Release packages

# Builds .deb, .rpm, a Snap, an Arch binary tarball (for AUR minnow-bin),
# and a source tarball (for AUR minnow), then attaches all of them to a GitHub Release.
#
# Triggers on pushing a tag like v0.1.0. Can also be run manually (workflow_dispatch) against
# any existing tag to rebuild/re-attach artifacts without cutting a new release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      run_arch:
        description: 'Build Arch binary tarball'
        type: boolean
        default: true
      run_deb:
        description: 'Build .deb'
        type: boolean
        default: true
      run_rpm:
        description: 'Build .rpm'
        type: boolean
        default: true
      run_snap:
        description: 'Build Snap'
        type: boolean
        default: true
      run_aur:
        description: 'Publish to AUR'
        type: boolean
        default: true

jobs:
  # Every package format's version string is derived from the pushed tag here, instead of
  # requiring CMakeLists.txt, the RPM spec, the deb changelog, and snapcraft.yaml to all be
  # hand-bumped in lockstep before tagging a release.
  compute-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build-arch-binary:
    needs: compute-version
    if: ${{ github.event_name == 'push' || inputs.run_arch }}
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake extra-cmake-modules \
            qt6-base kcoreaddons kconfigwidgets kwidgetsaddons kio kfilemetadata karchive knotifications git
      - uses: actions/checkout@v4
      - name: Build and install to a staging root
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=OFF \
            -DMINNOW_APP_VERSION="${{ needs.compute-version.outputs.version }}"
          cmake --build build -j"$(nproc)"
          DESTDIR="$PWD/pkgroot" cmake --install build
      - name: Create binary tarball
        run: |
          cd pkgroot
          tar -czf "../minnow-${GITHUB_REF_NAME}-x86_64.tar.gz" usr
      - uses: actions/upload-artifact@v4
        with:
          name: arch-binary-tarball
          path: minnow-*-x86_64.tar.gz

  build-deb:
    needs: compute-version
    if: ${{ github.event_name == 'push' || inputs.run_deb }}
    runs-on: ubuntu-24.04
    # .deb is Debian's native format - build on actual Debian rather than Ubuntu. Trixie
    # (13, current testing/soon-stable) has current KF6; bookworm (stable) predates it.
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake extra-cmake-modules qt6-base-dev \
            libkf6coreaddons-dev libkf6configwidgets-dev libkf6widgetsaddons-dev libkf6kio-dev \
            libkf6filemetadata-dev libkf6archive-dev libkf6notifications-dev \
            debhelper devscripts fakeroot git
      - uses: actions/checkout@v4
      - name: Build .deb
        run: packaging/deb/build.sh
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  build-rpm:
    needs: compute-version
    if: ${{ github.event_name == 'push' || inputs.run_rpm }}
    runs-on: ubuntu-24.04
    container: fedora:40
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y rpm-build cmake gcc-c++ extra-cmake-modules git tar \
            qt6-qtbase-devel kf6-kcoreaddons-devel kf6-kconfigwidgets-devel \
            kf6-kwidgetsaddons-devel kf6-kio-devel kf6-kfilemetadata-devel \
            kf6-karchive-devel kf6-knotifications-devel
      - uses: actions/checkout@v4
      - name: Build .rpm
        run: packaging/rpm/build.sh
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*.rpm

  build-snap:
    needs: compute-version
    if: ${{ github.event_name == 'push' || inputs.run_snap }}
    runs-on: ubuntu-24.04
    # `secrets` isn't a recognized context inside a step's `if:` directly - routing it
    # through a job-level env var is the standard workaround.
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
      - name: Set package version
        run: |
          sed -i "s/^version: .*/version: '${{ needs.compute-version.outputs.version }}'/" packaging/snap/snapcraft.yaml
          sed -i "s/source-tag: '.*'/source-tag: '${GITHUB_REF_NAME}'/" packaging/snap/snapcraft.yaml
      - uses: snapcore/action-build@v1
        id: build
        with:
          path: packaging/snap
      - uses: actions/upload-artifact@v4
        with:
          name: snap-package
          path: ${{ steps.build.outputs.snap }}
      # Skipped entirely until SNAPCRAFT_STORE_CREDENTIALS is added in repo settings
      # (from `snapcraft export-login`).
      - name: Publish to the Snap Store
        if: ${{ env.SNAPCRAFT_STORE_CREDENTIALS != '' }}
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  create-release:
    needs: [build-arch-binary, build-deb, build-rpm, build-snap]
    runs-on: ubuntu-24.04
    # The default GITHUB_TOKEN is read-only unless explicitly granted write access here -
    # this avoids needing to change the repo-wide Actions token permission default.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create source tarball
        run: git archive --format=tar.gz --prefix=minnow-${GITHUB_REF_NAME#v}/ -o minnow-${GITHUB_REF_NAME}-src.tar.gz HEAD
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          mkdir -p release-files
          cp minnow-*-src.tar.gz release-files/
          # Excludes rpmbuild's auto-generated debuginfo/debugsource/src.rpm sub-packages
          # and debhelper's auto-generated dbgsym .deb - just the installable packages.
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.snap' -o -name '*.tar.gz' \) \
            ! -name '*dbgsym*' ! -name '*debuginfo*' ! -name '*debugsource*' ! -name '*.src.rpm' \
            -exec cp {} release-files/ \;
          ls -la release-files/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-files/*

  publish-aur:
    if: ${{ github.event_name == 'push' || inputs.run_aur }}
    needs: [compute-version, create-release]
    runs-on: ubuntu-24.04
    container: archlinux:latest
    # Commits the bumped pkgver/checksums back to main, so the checked-in PKGBUILDs don't
    # go stale the moment this job updates the AUR copies.
    permissions:
      contents: write
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed base-devel git openssh pacman-contrib
      - uses: actions/checkout@v4
      - name: Set up AUR SSH access
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF
          git config --global user.name "Minnow release bot"
          git config --global user.email "noreply@example.com"
      - name: Bump PKGBUILD versions and checksums
        run: |
          VERSION="${{ needs.compute-version.outputs.version }}"
          for pkg in minnow minnow-bin; do
            sed -i "s/^pkgver=.*/pkgver=$VERSION/; s/^pkgrel=.*/pkgrel=1/" packaging/aur/$pkg/PKGBUILD
            (cd packaging/aur/$pkg && updpkgsums && makepkg --printsrcinfo > .SRCINFO)
          done
      - name: Push to AUR
        run: |
          for pkg in minnow minnow-bin; do
            git clone "ssh://aur@aur.archlinux.org/$pkg.git" "/tmp/aur-$pkg"
            cp packaging/aur/$pkg/PKGBUILD packaging/aur/$pkg/.SRCINFO "/tmp/aur-$pkg/"
            cd "/tmp/aur-$pkg"
            git add PKGBUILD .SRCINFO
            git commit -m "Update to ${{ needs.compute-version.outputs.version }}" || { echo "no changes for $pkg"; cd -; continue; }
            git push origin master
            cd -
          done
      - name: Commit updated PKGBUILDs/.SRCINFOs back to main
        # The checkout above leaves HEAD detached at the tag, so pushing straight back isn't
        # safe if main has moved on since - use a separate worktree on main and copy the
        # freshly updated files into it instead.
        run: |
          git fetch origin main
          git worktree add /tmp/main-worktree origin/main
          for pkg in minnow minnow-bin; do
            cp packaging/aur/$pkg/PKGBUILD packaging/aur/$pkg/.SRCINFO /tmp/main-worktree/packaging/aur/$pkg/
          done
          cd /tmp/main-worktree
          git add packaging/aur/*/PKGBUILD packaging/aur/*/.SRCINFO
          git commit -m "Update AUR packages to ${{ needs.compute-version.outputs.version }}" || { echo "no changes to commit"; exit 0; }
          git push origin HEAD:main

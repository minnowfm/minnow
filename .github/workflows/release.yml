name: Release packages

# builds .deb/.rpm/snap/arch-tarball/src-tarball and attaches them to a GitHub Release.
# runs on tag push (v0.1.0 etc), or manually against an existing tag to redo artifacts
# without cutting a new release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      run_arch:
        description: 'Build Arch binary tarball'
        type: boolean
        default: true
      run_deb:
        description: 'Build .deb'
        type: boolean
        default: true
      run_rpm:
        description: 'Build .rpm'
        type: boolean
        default: true
      run_snap:
        description: 'Build Snap'
        type: boolean
        default: true
      run_aur:
        description: 'Publish to AUR'
        type: boolean
        default: true

jobs:
  # single source of truth for the version string, derived from the tag - saves having to
  # hand-bump CMakeLists.txt/spec/changelog/snapcraft.yaml all in lockstep
  compute-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build-arch-binary:
    needs: compute-version
    if: ${{ github.event_name == 'push' || inputs.run_arch }}
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake extra-cmake-modules \
            qt6-base kcoreaddons kconfigwidgets kwidgetsaddons kio kfilemetadata karchive knotifications kwindowsystem git
      - uses: actions/checkout@v4
      - name: Build and install to a staging root
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=OFF \
            -DMINNOW_APP_VERSION="${{ needs.compute-version.outputs.version }}"
          cmake --build build -j"$(nproc)"
          DESTDIR="$PWD/pkgroot" cmake --install build
      - name: Create binary tarball
        run: |
          cd pkgroot
          tar -czf "../minnow-${GITHUB_REF_NAME}-x86_64.tar.gz" usr
      - uses: actions/upload-artifact@v4
        with:
          name: arch-binary-tarball
          path: minnow-*-x86_64.tar.gz

  build-deb:
    needs: compute-version
    if: ${{ github.event_name == 'push' || inputs.run_deb }}
    runs-on: ubuntu-24.04
    # building on real Debian, not Ubuntu, since it's a .deb - trixie has current KF6,
    # bookworm (stable) doesn't yet
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake extra-cmake-modules qt6-base-dev \
            libkf6coreaddons-dev libkf6configwidgets-dev libkf6widgetsaddons-dev libkf6kio-dev \
            libkf6filemetadata-dev libkf6archive-dev libkf6notifications-dev libkf6windowsystem-dev \
            debhelper devscripts fakeroot git
      - uses: actions/checkout@v4
      - name: Build .deb
        run: packaging/deb/build.sh
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  build-rpm:
    needs: compute-version
    if: ${{ github.event_name == 'push' || inputs.run_rpm }}
    runs-on: ubuntu-24.04
    container: fedora:40
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y rpm-build cmake gcc-c++ extra-cmake-modules git tar \
            qt6-qtbase-devel kf6-kcoreaddons-devel kf6-kconfigwidgets-devel \
            kf6-kwidgetsaddons-devel kf6-kio-devel kf6-kfilemetadata-devel \
            kf6-karchive-devel kf6-knotifications-devel kf6-kwindowsystem-devel
      - uses: actions/checkout@v4
      - name: Build .rpm
        run: packaging/rpm/build.sh
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*.rpm

  build-snap:
    needs: compute-version
    if: ${{ github.event_name == 'push' || inputs.run_snap }}
    runs-on: ubuntu-24.04
    # can't reference `secrets` directly in a step's `if:`, hence the env var indirection
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
      - name: Set package version
        run: |
          sed -i "s/^version: .*/version: '${{ needs.compute-version.outputs.version }}'/" packaging/snap/snapcraft.yaml
          sed -i "s/source-tag: '.*'/source-tag: '${GITHUB_REF_NAME}'/" packaging/snap/snapcraft.yaml
      - uses: snapcore/action-build@v1
        id: build
        with:
          path: packaging/snap
      - uses: actions/upload-artifact@v4
        with:
          name: snap-package
          path: ${{ steps.build.outputs.snap }}
      # no-op until SNAPCRAFT_STORE_CREDENTIALS gets added to repo secrets (snapcraft export-login)
      - name: Publish to the Snap Store
        if: ${{ env.SNAPCRAFT_STORE_CREDENTIALS != '' }}
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  create-release:
    needs: [build-arch-binary, build-deb, build-rpm, build-snap]
    runs-on: ubuntu-24.04
    # GITHUB_TOKEN is read-only by default, granting write here beats changing the repo-wide setting
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create source tarball
        run: git archive --format=tar.gz --prefix=minnow-${GITHUB_REF_NAME#v}/ -o minnow-${GITHUB_REF_NAME}-src.tar.gz HEAD
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          mkdir -p release-files
          cp minnow-*-src.tar.gz release-files/
          # skip the auto-generated debuginfo/debugsource/src.rpm/dbgsym junk, just the real packages
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.snap' -o -name '*.tar.gz' \) \
            ! -name '*dbgsym*' ! -name '*debuginfo*' ! -name '*debugsource*' ! -name '*.src.rpm' \
            -exec cp {} release-files/ \;
          ls -la release-files/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-files/*

  update-metainfo:
    needs: create-release
    runs-on: ubuntu-24.04
    # needs write access to commit the regenerated release history back to main
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate release history from GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .[] | "    <release version=\"" + (.tagName | ltrimstr("v")) + "\" date=\"" + (.publishedAt | split("T")[0]) + "\"/>"' \
            > /tmp/releases_block.txt
          awk -v rf=/tmp/releases_block.txt '
            /<releases>/ { print; while ((getline line < rf) > 0) print line; skip=1; next }
            /<\/releases>/ { skip=0 }
            !skip
          ' data/io.github.minnowfm.Minnow.metainfo.xml > /tmp/metainfo.xml.new
          mv /tmp/metainfo.xml.new data/io.github.minnowfm.Minnow.metainfo.xml
      - name: Commit updated metainfo back to main
        # same reasoning as publish-aur's commit-back step below - HEAD is detached at the
        # tag from the checkout above, so push straight from here isn't safe if main moved
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main
          git worktree add /tmp/main-worktree origin/main
          cp data/io.github.minnowfm.Minnow.metainfo.xml /tmp/main-worktree/data/
          cd /tmp/main-worktree
          git add data/io.github.minnowfm.Minnow.metainfo.xml
          git -c user.name="Minnow release bot" -c user.email="noreply@example.com" \
            commit -m "Update release history in metainfo from GitHub releases" || { echo "no changes to commit"; exit 0; }
          git push origin HEAD:main

  publish-aur:
    if: ${{ github.event_name == 'push' || inputs.run_aur }}
    needs: [compute-version, create-release]
    runs-on: ubuntu-24.04
    container: archlinux:latest
    # needs write access to commit the bumped pkgver/checksums back to main once AUR's updated
    permissions:
      contents: write
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git openssh pacman-contrib
          # makepkg/updpkgsums won't run as root, so checksum generation below runs as this
          # user instead - which then makes root's later git commands complain about
          # "dubious ownership", hence the safe.directory override too
          useradd -m builder
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: Set up AUR SSH access
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          # fixed /tmp path instead of ~/.ssh - HOME in this container isn't /root, so "~"
          # resolved inconsistently between steps and the key kept coming up "not found"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /tmp/aur_ssh_key
          chmod 600 /tmp/aur_ssh_key
      - name: Bump PKGBUILD versions and checksums
        run: |
          VERSION="${{ needs.compute-version.outputs.version }}"
          chown -R builder:builder "$GITHUB_WORKSPACE"
          for pkg in minnow minnow-bin; do
            sed -i "s/^pkgver=.*/pkgver=$VERSION/; s/^pkgrel=.*/pkgrel=1/" packaging/aur/$pkg/PKGBUILD
            su builder -c "cd '$GITHUB_WORKSPACE/packaging/aur/$pkg' && updpkgsums && makepkg --printsrcinfo > .SRCINFO"
          done
      - name: Push to AUR
        env:
          GIT_SSH_COMMAND: ssh -i /tmp/aur_ssh_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/aur_known_hosts
        run: |
          for pkg in minnow minnow-bin; do
            git clone "ssh://aur@aur.archlinux.org/$pkg.git" "/tmp/aur-$pkg"
            cp packaging/aur/$pkg/PKGBUILD packaging/aur/$pkg/.SRCINFO "/tmp/aur-$pkg/"
            cd "/tmp/aur-$pkg"
            git add PKGBUILD .SRCINFO
            # passing identity via -c instead of --global, same HOME weirdness as the SSH key above
            git -c user.name="Minnow release bot" -c user.email="noreply@example.com" \
              commit -m "Update to ${{ needs.compute-version.outputs.version }}" || { echo "no changes for $pkg"; cd -; continue; }
            git push origin master
            cd -
          done
      - name: Commit updated PKGBUILDs/.SRCINFOs back to main
        # HEAD is detached at the tag from the checkout above, can't just push that if main
        # has moved - use a worktree on main instead and copy the updated files in
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main
          git worktree add /tmp/main-worktree origin/main
          for pkg in minnow minnow-bin; do
            cp packaging/aur/$pkg/PKGBUILD packaging/aur/$pkg/.SRCINFO /tmp/main-worktree/packaging/aur/$pkg/
          done
          cd /tmp/main-worktree
          git add packaging/aur/*/PKGBUILD packaging/aur/*/.SRCINFO
          git -c user.name="Minnow release bot" -c user.email="noreply@example.com" \
            commit -m "Update AUR packages to ${{ needs.compute-version.outputs.version }}" || { echo "no changes to commit"; exit 0; }
          git push origin HEAD:main

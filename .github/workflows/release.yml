name: Release packages

# Builds .deb, .rpm, a Snap, a Flatpak bundle, an Arch binary tarball (for AUR minnow-bin),
# and a source tarball (for AUR minnow), then attaches all of them to a GitHub Release.
#
# Triggers on pushing a tag like v0.1.0. Can also be run manually (workflow_dispatch) against
# any existing tag to rebuild/re-attach artifacts without cutting a new release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      run_arch:
        description: 'Build Arch binary tarball'
        type: boolean
        default: true
      run_deb:
        description: 'Build .deb'
        type: boolean
        default: true
      run_rpm:
        description: 'Build .rpm'
        type: boolean
        default: true
      run_snap:
        description: 'Build Snap'
        type: boolean
        default: true
      run_flatpak:
        description: 'Build Flatpak'
        type: boolean
        default: true

jobs:
  build-arch-binary:
    if: ${{ github.event_name == 'push' || inputs.run_arch }}
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake extra-cmake-modules \
            qt6-base kcoreaddons kconfigwidgets kwidgetsaddons kio git
      - uses: actions/checkout@v4
      - name: Build and install to a staging root
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=OFF
          cmake --build build -j"$(nproc)"
          DESTDIR="$PWD/pkgroot" cmake --install build
      - name: Create binary tarball
        run: |
          cd pkgroot
          tar -czf "../minnow-${GITHUB_REF_NAME}-x86_64.tar.gz" usr
      - uses: actions/upload-artifact@v4
        with:
          name: arch-binary-tarball
          path: minnow-*-x86_64.tar.gz

  build-deb:
    if: ${{ github.event_name == 'push' || inputs.run_deb }}
    runs-on: ubuntu-24.04
    # .deb is Debian's native format - build on actual Debian rather than Ubuntu. Trixie
    # (13, current testing/soon-stable) has current KF6; bookworm (stable) predates it.
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake extra-cmake-modules qt6-base-dev \
            libkf6coreaddons-dev libkf6configwidgets-dev libkf6widgetsaddons-dev libkf6kio-dev \
            debhelper devscripts fakeroot git
      - uses: actions/checkout@v4
      - name: Build .deb
        run: packaging/deb/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  build-rpm:
    if: ${{ github.event_name == 'push' || inputs.run_rpm }}
    runs-on: ubuntu-24.04
    container: fedora:40
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y rpm-build cmake gcc-c++ extra-cmake-modules git tar \
            qt6-qtbase-devel kf6-kcoreaddons-devel kf6-kconfigwidgets-devel \
            kf6-kwidgetsaddons-devel kf6-kio-devel
      - uses: actions/checkout@v4
      - name: Build .rpm
        run: packaging/rpm/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*.rpm

  build-snap:
    if: ${{ github.event_name == 'push' || inputs.run_snap }}
    runs-on: ubuntu-24.04
    # `secrets` isn't a recognized context inside a step's `if:` directly - routing it
    # through a job-level env var is the standard workaround.
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: build
        with:
          path: packaging/snap
      - uses: actions/upload-artifact@v4
        with:
          name: snap-package
          path: ${{ steps.build.outputs.snap }}
      # Skipped entirely until SNAPCRAFT_STORE_CREDENTIALS is added in repo settings
      # (from `snapcraft export-login`).
      - name: Publish to the Snap Store
        if: ${{ env.SNAPCRAFT_STORE_CREDENTIALS != '' }}
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  build-flatpak:
    if: ${{ github.event_name == 'push' || inputs.run_flatpak }}
    runs-on: ubuntu-24.04
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.7
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: minnow.flatpak
          manifest-path: packaging/flatpak/net.minnow.Minnow.yaml
          cache-key: flatpak-builder-${{ github.sha }}

  create-release:
    needs: [build-arch-binary, build-deb, build-rpm, build-snap, build-flatpak]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create source tarball
        run: git archive --format=tar.gz --prefix=minnow-${GITHUB_REF_NAME#v}/ -o minnow-${GITHUB_REF_NAME}-src.tar.gz HEAD
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          mkdir -p release-files
          cp minnow-*-src.tar.gz release-files/
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.snap' -o -name '*.flatpak' -o -name '*.tar.gz' \) -exec cp {} release-files/ \;
          ls -la release-files/
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
